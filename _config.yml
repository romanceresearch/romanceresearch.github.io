# Welcome to Jekyll!
#
# This config file contains global site settings for Romance Research.
# If you change this file locally, restart the Jekyll server.

# Basic Site Settings
locale                   : "en-US"
site_theme               : "sunrise"
title                    : "Romance Research"
title_separator          : "-"
name                     : &name "Romance Research"
description              : &description "A playful independent journal exploring love, attraction, relationships, longing, heartbreak, compatibility, and modern dating through essays, field notes, and speculative research."
url                      : "https://romanceresearch.org"
baseurl                  : ""
repository               : "romanceresearch/romanceresearch.github.io"

# Site Author / Sidebar
author:
  avatar                 : "/images/logo.png"
  name                   : "Romance Research"
  pronouns               :
  bio                    : "A playful research journal and editorial collective studying love, attraction, intimacy, modern dating, heartbreak, and the strange logic of human connection."
  location               : "Internet"
  employer               : "Independent Research Collective"
  uri                    : "https://romanceresearch.org"
  email                  : "editor@romanceresearch.org"

  # Academic websites
  academia               :
  arxiv                  :
  googlescholar          :
  inspire-hep            :
  impactstory            :
  orcid                  :
  semantic               :
  ssrn                   :
  pubmed                 :
  researchgate           :
  scopus                 :
  zotero                 :

  # Repositories and software development
  bitbucket              :
  codepen                :
  dribbble               :
  github                 : "romanceresearch"
  kaggle                 :
  stackoverflow          :

  # Social media
  artstation             :
  bluesky                :
  facebook               :
  flickr                 :
  foursquare             :
  goodreads              :
  google_plus            :
  keybase                :
  instagram              :
  lastfm                 :
  linkedin               :
  mastodon               :
  medium                 :
  pinterest              :
  soundcloud             :
  steam                  :
  telegram               :
  tumblr                 :
  twitter                :
  vine                   :
  weibo                  :
  wikipedia              :
  xing                   :
  youtube                :
  zhihu                  :

# Publication Categories
publication_category:
  books:
    title: "Books"
  manuscripts:
    title: "Papers"
  conferences:
    title: "Research Notes"

# Site Settings
teaser                   :
breadcrumbs              : false
words_per_minute         : 180
future                   : true
read_more                : "disabled"
talkmap_link             : false

comments:
  provider               :
  disqus:
    shortname            :
  discourse:
    server               :
  facebook:
    appid                :
    num_posts            :
    colorscheme          :

staticman:
  allowedFields          : ['name', 'email', 'url', 'message']
  branch                 : "gh-pages"
  commitMessage          : "New comment."
  filename               : comment-{@timestamp}
  format                 : "yml"
  moderation             : true
  path                   : "_data/comments/{options.slug}"
  requiredFields         : ['name', 'email', 'message']
  transforms:
    email                : "md5"
  generatedFields:
    date:
      type               : "date"
      options:
        format           : "iso8601"

atom_feed:
  hide                   : false
  path                   :

# SEO Related
google_site_verification :
bing_site_verification   :
alexa_site_verification  :
yandex_site_verification :

# Social Sharing
twitter:
  username               : &twitter
facebook:
  username               :
  app_id                 :
  publisher              :
og_image                 :
og_description           : "Romance Research is an independent journal publishing essays, papers, and field notes on love, attraction, compatibility, intimacy, and modern relationships."

social:
  type                   : "Organization"
  name                   : "Romance Research"
  links:
    - "https://romanceresearch.org"
    - "https://github.com/romanceresearch"

# Analytics
analytics:
  provider               : false
  google:
    tracking_id          :

# Reading Files
include:
  - .htaccess
  - _pages
  - files

exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - node_modules
  - package.json*
  - Rakefile
  - README
  - tmp
  - vendor

keep_files:
  - .git
  - .svn

encoding                  : "utf-8"
markdown_ext              : "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown                  : kramdown
highlighter               : rouge
lsi                       : false
excerpt_separator         : "\n\n"
incremental               : false

# Markdown Processing
kramdown:
  input                   : GFM
  hard_wrap               : false
  auto_ids                : true
  footnote_nr             : 1
  entity_output           : as_char
  toc_levels              : 1..6
  smart_quotes            : lsquo,rsquo,ldquo,rdquo
  enable_coderay          : false

# Collections
collections:
  teaching:
    output                : true
    permalink             : /:collection/:path/
  publications:
    output                : true
    permalink             : /:collection/:path/
  portfolio:
    output                : true
    permalink             : /:collection/:path/
  talks:
    output                : true
    permalink             : /:collection/:path/

# Defaults
defaults:
  # Posts
  - scope:
      path                : ""
      type                : posts
    values:
      layout              : single
      author_profile      : false
      read_time           : true
      comments            : false
      share               : false
      related             : false

  # Pages
  - scope:
      path                : ""
      type                : pages
    values:
      layout              : single
      author_profile      : false

  # Teaching
  - scope:
      path                : ""
      type                : teaching
    values:
      layout              : single
      author_profile      : false
      share               : false
      comments            : false

  # Publications
  - scope:
      path                : ""
      type                : publications
    values:
      layout              : single
      author_profile      : false
      share               : false
      comments            : false

  # Portfolio
  - scope:
      path                : ""
      type                : portfolio
    values:
      layout              : single
      author_profile      : false
      share               : false
      comments            : false

  # Talks
  - scope:
      path                : ""
      type                : talks
    values:
      layout              : talk
      author_profile      : false
      share               : false

# Sass/SCSS
sass:
  sass_dir                : _sass
  style                   : compressed

# Outputting
permalink                 : /:categories/:title/
# paginate                : 5
# paginate_path           : /page:num/
timezone                  : Etc/UTC

# Plugins
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

# Mimic GitHub Pages with --safe
whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

# Archives
category_archive:
  type                    : liquid
  path                    : /categories/

tag_archive:
  type                    : liquid
  path                    : /tags/

# HTML Compression
compress_html:
  clippings               : all
  ignore:
    envs                  : development
